<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Laxman Nepal</title>
<style>
:root{--bg:#080b12;--card:#101722;--line:#273244;--text:#f5f7fb;--muted:#96a1b3;--accent:#7c8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,#1d2748,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(620px,calc(100% - 32px));padding:34px;border:1px solid var(--line);border-radius:24px;background:var(--card);text-align:center}
.code{font-size:72px;font-weight:950;letter-spacing:-.08em;color:var(--accent);line-height:1}
h1{margin:10px 0;font-size:28px}p{color:var(--muted)}
a{display:inline-block;margin-top:12px;padding:11px 15px;border:1px solid var(--line);border-radius:11px;color:var(--text);text-decoration:none}
a.primary{background:var(--accent);border-color:var(--accent);color:#080b12;font-weight:800}
#status{font-size:11px;min-height:18px}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>Page not found</h1>
<p id="message">Checking whether this URL is a repository shortcut…</p>
<div id="actions"><a class="primary" href="./">Back to portfolio</a></div>
</main>
<script>
(async()=>{
  const status=document.getElementById('message');
  const actions=document.getElementById('actions');
  const clean=location.pathname.replace(/\\/+$/,'').split('/').filter(Boolean);
  const candidate=clean.length?decodeURIComponent(clean[clean.length-1]):'';
  if(!candidate || /\.(html?|json|css|js|xml|txt|ico)$/i.test(candidate)){
    status.textContent='The requested page does not exist.';
    return;
  }
  try{
    const r=await fetch('https://api.github.com/repos/LaxmanNepal/'+encodeURIComponent(candidate),{
      headers:{Accept:'application/vnd.github+json'}
    });
    if(r.ok){
      status.textContent='Repository found. Redirecting…';
      const target=new URL('../repo.html',location.href);
      target.searchParams.set('repo',candidate);
      setTimeout(()=>location.replace(target.href),150);
      return;
    }
  }catch(e){}
  status.textContent='The requested page does not exist.';
  actions.insertAdjacentHTML('beforeend','<a href="https://github.com/LaxmanNepal" target="_blank" rel="noopener">Open GitHub profile</a>');
})();
</script>
</body>
</html>
